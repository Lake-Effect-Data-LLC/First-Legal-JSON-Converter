<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>First Legal JSON Case Converter</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;500;600;700;800&display=swap");

    :root {
      color-scheme: light;
      --bg: #f3f6fa;
      --surface: #ffffff;
      --surface-soft: #f7f9fc;
      --text: #111827;
      --muted: #5f6f86;
      --border: #d5deea;
      --border-strong: #9caec4;
      --brand: #022969;
      --brand-dark: #011f50;
      --brand-soft: #e6eef9;
      --brand-line: #0b428f;
      --success: #0f7a45;
      --success-bg: #e8f7ef;
      --danger: #b42318;
      --danger-bg: #fff0ed;
      --warning: #925b00;
      --warning-bg: #fff5dd;
      --shadow: 0 18px 50px rgba(15, 23, 42, 0.10);
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      --sans: "Roboto Condensed", "Arial Narrow", "Helvetica Neue Condensed", "Liberation Sans Narrow", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-stretch: condensed;
    }

    button,
    textarea {
      font: inherit;
    }

    .app {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 36px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
      padding: 16px 18px;
      border-radius: 8px;
      background: var(--brand);
      color: #fff;
      box-shadow: 0 18px 44px rgba(8, 47, 111, 0.18);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
      min-width: 0;
    }

    .brand-logo {
      display: block;
      width: min(420px, 52vw);
      height: auto;
      flex: 0 1 auto;
    }

    .brand-text {
      min-width: 0;
      margin-left: auto;
      text-align: right;
    }

    .eyebrow {
      margin: 0 0 2px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 2.6vw, 32px);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: 0;
    }

    .shell {
      overflow: hidden;
      border: 1px solid #c7d3e4;
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-bottom: 1px solid var(--border);
      background: #eef3f9;
    }

    .mode-toggle {
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
    }

    .mode-btn,
    .btn {
      min-height: 38px;
      border: 0;
      cursor: pointer;
      white-space: nowrap;
    }

    .mode-btn {
      padding: 0 14px;
      color: var(--muted);
      background: transparent;
      font-size: 15px;
      font-weight: 600;
    }

    .mode-btn.active {
      background: var(--brand);
      color: #fff;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      background: #fff;
      font-size: 15px;
      font-weight: 600;
    }

    .btn:hover {
      border-color: var(--border-strong);
      background: #f3f7fc;
    }

    .btn-primary {
      border-color: var(--brand);
      background: var(--brand);
      color: #fff;
    }

    .btn-primary:hover {
      border-color: var(--brand-dark);
      background: var(--brand-dark);
    }

    .icon {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      align-items: stretch;
    }

    .panel {
      display: flex;
      min-width: 0;
      flex-direction: column;
      background: #fff;
    }

    .panel + .panel {
      border-left: 1px solid var(--border);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 48px;
      padding: 0 14px;
      border-bottom: 1px solid var(--border);
      background: #fff;
    }

    label {
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    textarea {
      width: 100%;
      height: 320px;
      min-height: 220px;
      max-height: 620px;
      resize: vertical;
      border: 0;
      outline: 0;
      padding: 16px;
      background: #fbfcfe;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.55;
      tab-size: 2;
      overflow: auto;
    }

    textarea:focus {
      background: #fff;
      box-shadow: inset 0 0 0 2px var(--brand-soft);
    }

    textarea[readonly] {
      background: #f8fafc;
    }

    .footer {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      min-height: 46px;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      background: var(--surface-soft);
    }

    .status {
      display: none;
      align-items: center;
      gap: 8px;
      max-width: 100%;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 600;
    }

    .status.show {
      display: inline-flex;
    }

    .status.ok {
      background: var(--success-bg);
      color: var(--success);
    }

    .status.err {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .status.warn {
      background: var(--warning-bg);
      color: var(--warning);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 820px) {
      .app {
        width: min(100% - 20px, 1180px);
        padding-top: 18px;
      }

      .topbar,
      .toolbar,
      .footer {
        align-items: stretch;
        flex-direction: column;
      }

      .brand {
        align-items: flex-start;
        flex-direction: column;
      }

      .brand-text {
        margin-left: 0;
        text-align: left;
      }

      .brand-logo {
        width: min(100%, 360px);
      }

      .actions,
      .mode-toggle {
        width: 100%;
      }

      .actions {
        margin-left: 0;
      }

      .btn {
        flex: 1;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .panel + .panel {
        border-left: 0;
        border-top: 1px solid var(--border);
      }

      textarea {
        min-height: 320px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="assets/first-legal-logo.png" alt="First Legal">
        <div class="brand-text">
          <p class="eyebrow">Internal Tool</p>
          <h1>JSON Case Converter</h1>
        </div>
      </div>
    </header>

    <section class="shell" aria-labelledby="tool-title">
      <h2 id="tool-title" class="sr-only">JSON key case converter</h2>

      <div class="toolbar">
        <div class="mode-toggle" role="group" aria-label="Conversion mode">
          <button class="mode-btn active" id="btn-to-camel" type="button" aria-pressed="true">PascalCase -&gt; camelCase</button>
          <button class="mode-btn" id="btn-to-pascal" type="button" aria-pressed="false">camelCase -&gt; PascalCase</button>
        </div>

        <div class="actions">
          <button class="btn btn-primary" id="convert-btn" type="button">
            Convert
          </button>
          <button class="btn" id="copy-btn" type="button">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 8h10v12H8zM6 16H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>
            </svg>
            Copy
          </button>
          <button class="btn" id="clear-btn" type="button">
            Clear All
          </button>
        </div>
      </div>

      <div class="workspace">
        <div class="panel">
          <div class="panel-header">
            <label for="input">Input JSON</label>
            <span class="meta" id="input-meta">0 keys</span>
          </div>
          <textarea id="input" spellcheck="false" placeholder="Paste JSON here"></textarea>
        </div>

        <div class="panel">
          <div class="panel-header">
            <label for="output">Converted JSON</label>
            <span class="meta" id="output-meta">0 keys</span>
          </div>
          <textarea id="output" readonly spellcheck="false" placeholder="Output will appear here"></textarea>
        </div>
      </div>

      <div class="footer">
        <span id="status" class="status" role="status" aria-live="polite"></span>
      </div>
    </section>
  </main>

  <script>
    const state = {
      mode: 'toCamel',
      lastWarnings: []
    };

    const sample = {
      OrderEventType: '',
      LegalConnectOrderNumber: '5931352',
      OrderDate: '2022-05-18T15:00:54.82',
      orderType: 'eFiling',
      orderStatus: 'Closed Accepted',
      AccountNumber: '31641-FC',
      AccountName: 'Asset Law Group',
      PlacedBy: 'Joey Ojeda',
      TotalFees: 14.15,
      Documents: [
        {
          DocumentId: 'DOC-1001',
          FilingCode: 'MOT',
          PageCount: 12
        }
      ]
    };

    const els = {
      input: document.getElementById('input'),
      output: document.getElementById('output'),
      inputMeta: document.getElementById('input-meta'),
      outputMeta: document.getElementById('output-meta'),
      status: document.getElementById('status'),
      toCamel: document.getElementById('btn-to-camel'),
      toPascal: document.getElementById('btn-to-pascal'),
      convert: document.getElementById('convert-btn'),
      copy: document.getElementById('copy-btn'),
      clear: document.getElementById('clear-btn')
    };

    els.input.value = JSON.stringify(sample, null, 2);

    function pascalToCamel(key) {
      if (!key || key[0] !== key[0].toUpperCase() || key[0] === key[0].toLowerCase()) {
        return key;
      }

      let upperRun = 0;
      while (
        upperRun < key.length &&
        key[upperRun] === key[upperRun].toUpperCase() &&
        key[upperRun] !== key[upperRun].toLowerCase()
      ) {
        upperRun += 1;
      }

      const charsToLower = upperRun > 1 && upperRun < key.length ? upperRun - 1 : upperRun;
      return key.slice(0, charsToLower).toLowerCase() + key.slice(charsToLower);
    }

    function camelToPascal(key) {
      return key ? key.charAt(0).toUpperCase() + key.slice(1) : key;
    }

    function transformKeys(value, fn, path = '$') {
      if (Array.isArray(value)) {
        return value.map((item, index) => transformKeys(item, fn, `${path}[${index}]`));
      }

      if (!value || typeof value !== 'object') {
        return value;
      }

      const result = {};
      for (const [key, childValue] of Object.entries(value)) {
        const nextKey = fn(key);
        if (Object.prototype.hasOwnProperty.call(result, nextKey)) {
          state.lastWarnings.push(`Duplicate key after conversion at ${path}: ${nextKey}`);
        }
        result[nextKey] = transformKeys(childValue, fn, `${path}.${nextKey}`);
      }
      return result;
    }

    function countKeys(value) {
      if (Array.isArray(value)) {
        return value.reduce((total, item) => total + countKeys(item), 0);
      }

      if (!value || typeof value !== 'object') {
        return 0;
      }

      return Object.entries(value).reduce((total, [, childValue]) => total + 1 + countKeys(childValue), 0);
    }

    function setStatus(message, type) {
      els.status.textContent = message;
      els.status.className = `status show ${type}`;
    }

    function clearStatus() {
      els.status.textContent = '';
      els.status.className = 'status';
    }

    function fitTextarea(textarea) {
      textarea.style.height = 'auto';
      const nextHeight = Math.min(Math.max(textarea.scrollHeight, 220), 620);
      textarea.style.height = `${nextHeight}px`;
    }

    function fitTextareas() {
      fitTextarea(els.input);
      fitTextarea(els.output);
    }

    function updateMode(nextMode) {
      state.mode = nextMode;
      const toCamel = nextMode === 'toCamel';
      els.toCamel.classList.toggle('active', toCamel);
      els.toPascal.classList.toggle('active', !toCamel);
      els.toCamel.setAttribute('aria-pressed', String(toCamel));
      els.toPascal.setAttribute('aria-pressed', String(!toCamel));
      els.output.value = '';
      els.outputMeta.textContent = '0 keys';
      fitTextareas();
      setStatus('Mode selected. Press Convert to update the output.', 'warn');
    }

    function updateInputMeta() {
      const input = els.input.value.trim();

      if (!input) {
        els.inputMeta.textContent = '0 keys';
        return;
      }

      try {
        const parsed = JSON.parse(input);
        const inputKeys = countKeys(parsed);
        els.inputMeta.textContent = `${inputKeys} ${inputKeys === 1 ? 'key' : 'keys'}`;
      } catch (error) {
        els.inputMeta.textContent = 'Invalid JSON';
      }
    }

    function convert() {
      const input = els.input.value.trim();
      state.lastWarnings = [];

      if (!input) {
        els.output.value = '';
        els.inputMeta.textContent = '0 keys';
        els.outputMeta.textContent = '0 keys';
        fitTextareas();
        clearStatus();
        return;
      }

      try {
        const parsed = JSON.parse(input);
        const fn = state.mode === 'toCamel' ? pascalToCamel : camelToPascal;
        const result = transformKeys(parsed, fn);
        const inputKeys = countKeys(parsed);
        const outputKeys = countKeys(result);

        els.output.value = JSON.stringify(result, null, 2);
        fitTextareas();
        els.inputMeta.textContent = `${inputKeys} ${inputKeys === 1 ? 'key' : 'keys'}`;
        els.outputMeta.textContent = `${outputKeys} ${outputKeys === 1 ? 'key' : 'keys'}`;

        if (state.lastWarnings.length) {
          setStatus(`${state.lastWarnings.length} duplicate ${state.lastWarnings.length === 1 ? 'key' : 'keys'} after conversion`, 'warn');
        } else {
          setStatus('Converted', 'ok');
        }
      } catch (error) {
        els.output.value = '';
        els.outputMeta.textContent = '0 keys';
        fitTextareas();
        setStatus(error.message || 'Invalid JSON', 'err');
      }
    }

    async function copyOutput() {
      const value = els.output.value;
      if (!value) {
        setStatus('Nothing to copy', 'warn');
        return;
      }

      try {
        await navigator.clipboard.writeText(value);
        setStatus('Copied to clipboard', 'ok');
      } catch (error) {
        els.output.focus();
        els.output.select();
        setStatus('Select the output and copy manually', 'warn');
      }
    }

    function clearAll() {
      els.input.value = '';
      els.output.value = '';
      els.inputMeta.textContent = '0 keys';
      els.outputMeta.textContent = '0 keys';
      fitTextareas();
      clearStatus();
      els.input.focus();
    }

    els.toCamel.addEventListener('click', () => updateMode('toCamel'));
    els.toPascal.addEventListener('click', () => updateMode('toPascal'));
    els.convert.addEventListener('click', convert);
    els.copy.addEventListener('click', copyOutput);
    els.clear.addEventListener('click', clearAll);
    els.input.addEventListener('input', () => {
      updateInputMeta();
      els.output.value = '';
      els.outputMeta.textContent = '0 keys';
      fitTextareas();
      clearStatus();
    });

    updateInputMeta();
    fitTextareas();
  </script>
</body>
</html>
